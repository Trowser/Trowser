name: Nightly tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Trowser.sln -c Release
      - name: Unit and contract tests
        run: dotnet test src/Trowser.Tests/Trowser.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
      - name: API integration and sweeps
        run: dotnet test src/Trowser.ApiTests/Trowser.ApiTests.csproj -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
      - name: Offline regression suite
        shell: pwsh
        run: ./tests/regression/run-regression.ps1 -Exe "src/Trowser/bin/Release/net8.0-windows/win-x64/Trowser.exe"
      - name: API coverage report
        shell: pwsh
        run: ./scripts/api-coverage-report.ps1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-test-results
          path: |
            TestResults
            tests/regression/results.txt
            tests/api-coverage.md
