# Scheduled breadth without WebView2: unit/contract tests + API coverage heuristics.
# Browser API sweeps and full offline regression stay on push smoke CI and local test.ps1 -Level full.
name: Nightly tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-coverage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Trowser.sln -c Release
      - name: Unit and contract tests
        run: dotnet test src/Trowser.Tests/Trowser.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
      - name: API coverage report
        shell: pwsh
        run: ./scripts/api-coverage-report.ps1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-test-results
          path: |
            TestResults
            tests/api-coverage.md
