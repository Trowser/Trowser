id: aws-credentials-exposure

info:
  name: AWS Credentials File Exposure
  author: trowser
  severity: high
  description: Detects an exposed .aws/credentials file at the site origin.
  tags: exposure,files,secret,aws

http:
  - method: GET
    path:
      - "{{RootURL}}/.aws/credentials"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "aws_access_key_id"
          - "aws_secret_access_key"
        condition: or
        part: body
