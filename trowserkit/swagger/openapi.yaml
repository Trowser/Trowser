      description: Free memory after reviewing network data on traffic-heavy pages.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Network log cleared
          content:
            application/json:
              example:
                success: true
                data:
                  message: "Network log cleared."

  # â”€â”€ Journal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/journal/export:
    get:
      operationId: exportJournal
      tags: [Journal]
      summary: Export the journal as a formatted report
      description: |
        Render the full journal as Markdown (default) or self-contained HTML.
        Bugs and enhancements are grouped and sorted by priority. Screenshots
        attached to entries are referenced by path in the output (linked, not
        embedded) so reports stay small.
        Gate-free - always available.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [markdown, md, html]
            default: markdown
        - name: path
          in: query
          schema:
            type: string
          description: Optional file path to also write the report to disk
        - name: json
          in: query
          schema:
            type: boolean
          description: If true, wrap the document in a JSON envelope instead of returning it as the response body
      responses:
        "200":
          description: Generated report
          content:
            text/markdown:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/json:
              example:
                success: true
                data:
                  format: markdown
                  content: "# Trowser Session Journal\n..."
                  path: null

