  /api/extract:
    post:
      operationId: extractData
      tags: [Element Data]
      summary: Extract structured data into JSON array
      description: |
        Three modes:
        1. **Table auto-extract** - `{"selector": "table.data"}` - columns from `<th>` headers
        2. **Field mapping** - `{"selector": ".card", "fields": {"name": "h3", "url": "a@href"}}`
        3. **Simple list** - `{"selector": "ul li"}` - returns `[{text: "..."}]`

        Append `@attr` to sub-selectors for attributes (e.g., `a@href`, `img@src`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selector:
                  type: string
                  description: CSS selector for repeating container
                ref:
                  type: integer
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of field names to sub-selectors
                limit:
                  type: integer
                  description: Max items to extract
            examples:
              table:
                summary: Auto-extract table
                value:
                  selector: "table.products"
              fieldMapping:
                summary: Field mapping
                value:
                  selector: ".product-card"
                  fields:
                    name: "h3"
                    price: ".price"
                    url: "a@href"
              simpleList:
                summary: Simple list
                value:
                  selector: "ul.results li"
      responses:
        "200":
          description: Extracted data
          content:
            application/json:
              example:
                success: true
                data:
                  data:
                    - name: "Widget A"
                      price: "$9.99"
                      url: "/products/a"
                    - name: "Widget B"
                      price: "$19.99"
                      url: "/products/b"
                  count: 2
                  selector: ".product-card"

  # â”€â”€ Script Execution â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/execute-js:
    post:
      operationId: executeJs
      tags: [Script Execution]
      summary: Run JavaScript in page context
      description: |
        Blocked in safe mode. Scripts starting with `return` are auto-wrapped in an IIFE.
        Both `"document.title"` and `"return document.title"` work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script:
                  type: string
                  description: JavaScript expression or statements
            example:
              script: "document.title"
      responses:
        "200":
          description: Script result
          content:
            application/json:
              example:
                success: true
                data:
                  result: "Example Domain"
        "403":
          description: Blocked by safe mode


  /api/execute-script:
    post:
      operationId: executeScript
      tags: [Script Execution]
      summary: Run C# test script
      description: Same engine as CLI mode. Blocked in safe mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: C# script code
            example:
              code: "var title = await GetTitle();\nAssert.NotEmpty(title, \"Has title\");"
      responses:
        "200":
          description: Script execution result
          content:
            application/json:
              example:
                success: true
                data:
                  success: true
                  isCancelled: false
                  returnValue: null
                  elapsedMs: 150
                  assertions:
                    passed: 1
                    failed: 0
                    total: 1
                    allPassed: true
        "403":
          description: Blocked by safe mode


  /api/batch:
    post:
      operationId: batch
      tags: [Script Execution]
      summary: Execute multiple actions sequentially
      description: |
        Avoids stale-ref issues between steps. Supported actions:
        click, type, select, text, attribute, hover, scroll, wait, sleep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  items:
                    type: object
                    required: [action]
                    properties:
                      action:
                        type: string
                        enum: [click, type, select, text, attribute, hover, scroll, wait, sleep]
            example:
              actions:
                - action: type
                  ref: 0
                  text: "user@example.com"
                - action: type
                  ref: 1
                  text: "password123"
                - action: click
                  ref: 2
      responses:
        "200":
          description: Batch results
          content:
            application/json:
              example:
                success: true
                data:
                  results: []
                  completed: 3
                  total: 3

  # â”€â”€ Waiting â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/wait:
    post:
      operationId: waitForElement
      tags: [Waiting]
      summary: Wait for element to appear
      description: "Does **not** throw on timeout - returns found: true/false."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: integer
                selector:
                  type: string
                role:
                  type: string
                name:
                  type: string
                label:
                  type: string
                byText:
                  type: string
                timeout:
                  type: integer
                  default: 5000
            example:
              selector: ".dashboard"
              timeout: 5000
      responses:
        "200":
          description: Wait result
          content:
            application/json:
              examples:
                found:
                  value:
                    success: true
                    data:
                      found: true
                      selector: ".dashboard"
                timeout:
                  value:
                    success: true
                    data:
                      found: false
                      selector: ".dashboard"
                      timeoutMs: 5000


  /api/wait-for-network:
    post:
      operationId: waitForNetwork
      tags: [Waiting]
      summary: Wait for specific network request
      description: Wait for a request matching a URL substring. Eliminates guesswork and sleep calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urlPattern]
              properties:
                urlPattern:
                  type: string
                  description: URL substring (case-insensitive)
                method:
                  type: string
                  description: HTTP method filter
                status:
                  type: integer
                  description: Expected status code
                timeout:
                  type: integer
                  default: 10000
            example:
              urlPattern: "/api/validate"
              method: POST
              timeout: 10000
      responses:
        "200":
          description: Wait result
          content:
            application/json:
              examples:
                matched:
                  value:
                    success: true
                    data:
                      matched: true
                      url: "https://example.com/api/validate"
                      method: POST
                      status: 200
                      resourceType: Fetch
                      elapsedMs: 2340
                timeout:
                  value:
                    success: true
                    data:
                      matched: false
                      urlPattern: "/api/validate"
                      timeoutMs: 10000

