  # â”€â”€ Browser Fetch (API Testing) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/fetch:
    post:
      operationId: browserFetch
      tags: [Fetch]
      summary: Send HTTP request from browser context
      description: |
        Execute a `fetch()` request in the browser context. Includes the page's cookies,
        auth tokens, and session state automatically. Relative URLs resolve against the
        current page origin. Use `json` as a shorthand for JSON payloads - it auto-serializes
        and sets `Content-Type: application/json`. Blocked in safe mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: Request URL (absolute or relative to current page origin)
                method:
                  type: string
                  default: GET
                  description: "HTTP method: GET, POST, PUT, PATCH, DELETE"
                headers:
                  type: object
                  additionalProperties:
                    type: string
                  description: Request headers as key-value pairs
                body:
                  type: string
                  description: Request body as a string (form-encoded, XML, raw text, etc.)
                json:
                  description: JSON request body - auto-serialized, auto-sets Content-Type. Ignored if `body` is also provided.
                timeout:
                  type: integer
                  default: 30000
                  description: Request timeout in milliseconds
            examples:
              jsonShorthand:
                summary: POST with JSON shorthand
                value:
                  url: "/api/users"
                  method: POST
                  json: { name: "Alice", email: "alice@example.com" }
              explicitBody:
                summary: PATCH with explicit body and headers
                value:
                  url: "https://example.com/api/users/42"
                  method: PATCH
                  headers: { "Content-Type": "application/json" }
                  body: '{"name": "Updated"}'
              relativeGet:
                summary: GET with relative URL
                value:
                  url: "/api/health"
      responses:
        "200":
          description: Fetch response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        description: "true if status is 200-299"
                      status:
                        type: integer
                        description: HTTP status code
                      statusText:
                        type: string
                        description: HTTP status text
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                        description: Response headers
                      body:
                        type: string
                        description: Response body as a string
              example:
                success: true
                data:
                  ok: true
                  status: 200
                  statusText: OK
                  headers:
                    content-type: "application/json; charset=utf-8"
                  body: '{"id": 42, "name": "Updated"}'
        "403":
          description: Blocked by safe mode
        "500":
          description: Fetch failed (network error, CORS, etc.)

