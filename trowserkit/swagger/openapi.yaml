openapi: 3.0.3
info:
  title: Trowser REST API
  description: |
    REST API for **Trowser** - a Windows WebView2 browser with built-in test automation.

    ## Quick start

    1. Launch Trowser (API enabled by default on port 6923)
    2. Copy the API key from the status bar tooltip
    3. Click **Authorize** above and paste the key
    4. Try `GET /api/ping` - no auth needed, confirms the server is alive
    5. Try `GET /api/state` - returns the full page snapshot with interactive elements
    6. Use `ref` numbers from the snapshot to click, type, and assert

    ## Authentication

    All endpoints (except `/api/ping`) require a Bearer token:
    ```
    Authorization: Bearer <api-key>
    ```
    A random key is auto-generated each session. Use `--api-key <key>` for a stable key.

    ## Response format

    Every response follows `{"success": true, "data": {...}}` on success,
    or `{"success": false, "error": "..."}` on failure.

    ## Element targeting

    Action endpoints accept elements by **ref number** (preferred), **CSS selector**, or **semantic locator**:
    ```json
    {"ref": 5}
    {"selector": "#submit-btn"}
    {"role": "button", "name": "Submit"}
    {"label": "Email"}
    {"byText": "Sign in"}
    {"placeholder": "Search..."}
    {"testId": "submit-btn"}
    ```

    ## Safe mode

    When `--safe` is enabled, endpoints that execute scripts, manipulate cookies/storage,
    or set up mocks return HTTP 403.
  version: "1.1"
  contact:
    name: Trowser
  license:
    name: Proprietary

servers:
  - url: http://localhost:6923
    description: Default local Trowser instance
  - url: http://localhost:{port}
    description: Custom port
    variables:
      port:
        default: "6923"
        description: API port (override with --api-port)

security:
  - BearerAuth: []

tags:
  - name: Health & System
    description: Server health, abort, info, and session reset
  - name: Page State
    description: Page snapshots, screenshots, text, and HTML source
  - name: Console & Network
    description: Browser console messages and network traffic log
  - name: Journal
    description: Unified test journal - actions, notes, assertions, messages from human and LLM testers
  - name: Notifications
    description: Display messages to the human tester
  - name: Navigation
    description: URL navigation and wait-for-navigation helpers
  - name: Element Interaction
    description: Click, type, select, hover, scroll, keyboard, and text search
  - name: Element Data
    description: Read element text, attributes, properties, and extract structured data
  - name: Script Execution
    description: Run JavaScript or C# scripts, batch actions
  - name: Waiting
    description: Wait for elements, network requests, or page idle
  - name: Assertions
    description: Track pass/fail test assertions
  - name: Dialogs
    description: Handle native browser dialogs (alert, confirm, prompt)
  - name: Cookies
    description: Read, set, and delete cookies
  - name: Storage
    description: localStorage and sessionStorage management
  - name: Viewport
    description: Responsive testing - viewport size presets
  - name: Tabs
    description: Multi-tab management
  - name: WebMCP
    description: Page-registered MCP tools (navigator.modelContext)
  - name: Mocking
    description: Network mocking and fault injection
  - name: Interception
    description: Request breakpoints - pause, inspect, modify, replay
  - name: Load Testing
    description: Concurrent request load testing
  - name: Fetch
    description: Browser-context HTTP requests (includes cookies/auth)
  - name: Throttling
    description: Network speed throttling (2G, 3G, 4G, offline)
  - name: Auditing
    description: Accessibility, performance, security, HTML validation, compatibility, link checking, and consistency audits
  - name: Robustness
    description: Monkey testing, smart monkey, and fault-injection (interrupter)

  - name: Security Testing
    description: Vulnerability scanning, injection probes, auth testing, and security analysis
  - name: Peer Management
    description: Cross-instance testing - register peers and proxy requests across sessions
  - name: Authorization Testing
    description: BOLA/IDOR detection, authz boundary probes, and role matrix
  - name: Portable Identity
    description: Capture, apply, and hand off browser identities across sessions
  - name: Security Orchestration
    description: Goal-oriented security playbooks with unified safety and depth controls
  - name: VPX
    description: Vulnerability Proof eXchange - import, export, and render proof documents
  - name: Client TLS Certificates
    description: Client certificate management for mTLS testing
  - name: WebSocket
    description: WebSocket connection monitoring and messaging
  - name: Shadows
    description: Ambient UI overlays - security shadow, power mode, red team whisper
  - name: Utilities
    description: Test data, inspiration, and misc helpers
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key from the Trowser session. Find it in the status bar tooltip,
        or set a stable key with `--api-key <key>`.

  schemas:
    ElementTarget:
      type: object
      description: |
        Target an element by ref number (preferred), CSS selector, or semantic locator.
        Only one targeting method should be used per request.
      properties:
        ref:
          type: integer
          description: Ref number from GET /api/state interactiveElements
          example: 5
        selector:
          type: string
          description: CSS selector
          example: "#submit-btn"
        role:
          type: string
          description: ARIA role (use with `name`)
          example: button
        name:
          type: string
          description: Accessible name (use with `role`)
          example: Submit
        label:
          type: string
          description: Associated label text
          example: Email address
        byText:
          type: string
          description: Visible text content (case-insensitive)
          example: Sign in
        placeholder:
          type: string
          description: Input placeholder text
          example: "Search..."
        testId:
          type: string
          description: data-testid attribute value
          example: submit-btn
        timeout:
          type: integer
          description: Auto-wait timeout in ms (default 5000)
          example: 5000

    InteractiveElement:
      type: object
      properties:
        ref:
          type: integer
          description: "Ref number for actions. >= 0 visible, -1 hidden"
        tag:
          type: string
          example: input
        type:
          type: string
          example: text
        selector:
          type: string
          example: "#username"
        label:
          type: string
          example: Username
        text:
          type: string
          description: Visible text (buttons, links)
        value:
          type: string
        placeholder:
          type: string
        enabled:
          type: boolean
        required:
          type: boolean
        checked:
          type: boolean
          description: "Present for radio/checkbox only. True if checked."
        href:
          type: string
        visible:
          type: boolean


    SafetyModeRequest:
      type: object
      properties:
        safetyMode:
          type: string
          enum: [passive, safe, active, aggressive]
          default: safe
          description: |
            passive (observe only); safe (GET/HEAD/OPTIONS); active (all verbs);
            aggressive (stress/brute-force). Legacy confirmBackend true = active.
        verbose:
          type: boolean
          default: false
          description: Include verboseTrace with outbound request details (security scans).
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Missing required field: url"
      required: [success, error]

    BusyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        blockedBy:
          type: string
          example: "POST /api/execute-js"
        requestedPath:
          type: string
        dialogPending:
          type: boolean
        dialogType:
          type: string
        dialogMessage:
          type: string
        hint:
          type: string

paths:
  /api/ping:
    get:
      operationId: ping
      tags: [Health & System]
      summary: Health check (no auth)
      description: |
        Always responds immediately - never blocked by auth or the operation gate.
        Returns `busy: true` when another API call is in progress.
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      alive:
                        type: boolean
                        example: true
                      port:
                        type: integer
                        example: 6923
                      busy:
                        type: boolean
                        example: false
                      currentOperation:
                        type: string
                        nullable: true
                        example: null
              examples:
                idle:
                  summary: Server idle
                  value:
                    success: true
                    data:
                      alive: true
                      port: 6923
                      busy: false
                      currentOperation: null
                busy:
                  summary: Server busy
                  value:
                    success: true
                    data:
                      alive: true
                      port: 6923
                      busy: true
                      currentOperation: "POST /api/execute-js"


  /api/abort:
    post:
      operationId: abort
      tags: [Health & System]
      summary: Cancel stuck operation
      description: |
        Force-cancel the currently running operation and return the server to idle.
        Bypasses the gate - works even when the server is busy.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Operation cancelled (or nothing was running)
          content:
            application/json:
              examples:
                aborted:
                  summary: Operation was cancelled
                  value:
                    success: true
                    data:
                      aborted: "POST /api/navigate"
                      message: "Operation cancelled. Server is now idle."
                idle:
                  summary: Nothing to abort
                  value:
                    success: true
                    data:
                      aborted: null
                      message: "No operation in progress. Server is already idle."


  /api/info:
    get:
      operationId: getInfo
      tags: [Health & System]
      summary: Server version and page summary
      description: Returns server metadata, current URL/title, and assertion/console/network counts.
      responses:
        "200":
          description: Server info
          content:
            application/json:
              example:
                success: true
                data:
                  version: "1.0"
                  port: 6923
                  currentUrl: "https://example.com"
                  currentTitle: "Example Domain"
                  assertionCount: 0
                  consoleEntryCount: 5
                  networkEntryCount: 12


  /api/clear-all:
    post:
      operationId: clearAll
      tags: [Health & System]
      summary: Reset all test session state
      description: |
        Clears console, network, cookies, mocks, intercepts, assertions,
        throttle, viewport, localStorage, and sessionStorage in one call.
        Use between test sessions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: All state cleared
          content:
            application/json:
              example:
                success: true
                data:
                  message: "Cleared: console, network, mocks, intercepts, assertions, cookies, throttle, viewport, localStorage, sessionStorage (10 items)"
                  cleared:
                    - console
                    - network
                    - mocks
                    - intercepts
                    - assertions
                    - cookies
                    - throttle
                    - viewport
                    - localStorage
                    - sessionStorage

  # â”€â”€ Page State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/state:
    get:
      operationId: getState
      tags: [Page State]
      summary: Full page snapshot (main endpoint)
      description: |
        **The primary endpoint.** Returns URL, title, headings, interactive elements
        with ref numbers, page text, image summary, and error summaries.

        Use `ref` numbers from `interactiveElements` to target actions
        (`/api/click`, `/api/type`, etc.).

        **Workflow:**
        1. `GET /api/state` â†’ understand the page
        2. Use `ref` numbers to interact
        3. `GET /api/state` again â†’ see what changed
      parameters:
        - name: fullText
          in: query
          schema:
            type: boolean
            default: false
          description: Return untruncated pageText (default 3000 chars)
        - name: visible
          in: query
          schema:
            type: boolean
            default: true
          description: "Set to false to include hidden elements (ref: -1)"
        - name: selector
          in: query
          schema:
            type: string
          description: CSS selector to scope pageText and elements to a container
          example: ".product-card"
        - name: tag
          in: query
          schema:
            type: string
          description: Filter elements by HTML tag
          example: button
        - name: type
          in: query
          schema:
            type: string
          description: Filter elements by type/role
          example: checkbox
        - name: q
          in: query
          schema:
            type: string
          description: Filter elements by text/label (case-insensitive)
          example: submit
        - name: limit
          in: query
          schema:
            type: integer
          description: Max number of interactiveElements
          example: 20
        - name: sections
          in: query
          schema:
            type: string
          description: "Comma-separated sections: url, title, pageText, headings, interactiveElements, imageSummary, consoleErrors, networkErrors, assertionSummary, pageMeta, viewport"
          example: "interactiveElements,url,title"
      responses:
        "200":
          description: Page state snapshot
          content:
            application/json:
              example:
                success: true
                data:
                  url: "https://example.com/login"
                  title: "Login Page"
                  readyState: complete
                  pageText: "Welcome to Example. Please log in..."
                  refGeneration: 3
                  headings:
                    - level: h1
                      text: "Welcome to Example"
                      visible: "True"
                  interactiveElements:
                    - ref: 0
                      tag: input
                      type: text
                      selector: "#username"
                      label: Username
                      value: ""
                      placeholder: "Enter your username"
                      enabled: true
                      required: true
                      visible: true
                    - ref: 1
                      tag: input
                      type: password
                      selector: "#password"
                      label: Password
                      value: ""
                      placeholder: "Enter your password"
                      enabled: true
                      required: true
                      visible: true
                    - ref: 2
                      tag: button
                      type: submit
                      selector: "#login-btn"
                      label: "Log in"
                      text: "Log in"
                      enabled: true
                      visible: true
                  imageSummary:
                    total: 2
                    missingAlt: 0
                  consoleErrors: []
                  networkErrors: []
                  assertionSummary:
                    passed: 0
                    failed: 0
                    total: 0


  /api/state/enrich:
    post:
      operationId: enrichState
      tags: [Page State]
      summary: Batch-fetch element text and attributes
      description: |
        Fetch text and attributes for multiple refs in one call.
        Reduces round-trips when reading data from many elements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs, fields]
              properties:
                refs:
                  type: array
                  items:
                    type: integer
                  description: Array of ref numbers from GET /api/state
                  example: [0, 1, 2, 3]
                fields:
                  type: array
                  items:
                    type: string
                  description: "Fields to fetch: text, href, value, checked, placeholder, disabled, tag, id, className, name, type, role, title, required, readOnly, maxLength, pattern, min, max, step, src, alt, data-testid, etc."
                  example: ["text", "type", "required", "maxLength"]
            example:
              refs: [0, 1, 2]
              fields: ["text", "type", "required"]
      responses:
        "200":
          description: Element data
          content:
            application/json:
              example:
                success: true
                data:
                  elements:
                    - ref: 0
                      text: ""
                      type: email
                      required: true
                    - ref: 1
                      text: ""
                      type: password
                      required: true
                    - ref: 2
                      text: "Log in"
                      type: submit
                      required: false


  /api/diff-state:
    post:
      operationId: diffState
      tags: [Page State]
      summary: Diff two refGeneration snapshots
      description: |
        Compare stored snapshots keyed by refGeneration (from GET /api/state or GET /api/interactive).
        Returns elements added/removed (by selector), text/value changes, URL/title flags, and new console/network errors.
        Snapshots are a ring buffer (~96); POST /api/clear-all clears them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before, after]
              properties:
                before:
                  type: integer
                  description: Earlier refGeneration
                  example: 3
                after:
                  type: integer
                  description: Later refGeneration
                  example: 5
                tabIndex:
                  type: integer
                  minimum: 0
                  description: Optional tab index (default active tab)
            example:
              before: 3
              after: 5
      responses:
        "200":
          description: Structural diff between snapshots
          content:
            application/json:
              example:
                success: true
                data:
                  beforeRefGeneration: 3
                  afterRefGeneration: 5
                  elementsAdded: []
                  elementsRemoved: []
                  textChanged:
                    - selector: "#results"
                      before: "8 items"
                      after: "3 items"
                  urlChanged: false
                  titleChanged: false
                  newConsoleErrors: []
                  newNetworkErrors: []
        "400":
          description: Missing or invalid before/after
        "404":
          description: No stored snapshot for one of the generations


  /api/state/refresh:
    post:
      operationId: refreshState
      tags: [Page State]
      summary: Force page rescan after DOM mutations
      description: |
        Force a full page state rescan. Use after DOM mutations
        (clicking buttons that add/remove elements, AJAX content loading)
        when GET /api/state returns stale data.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Refreshed page state (same shape as GET /api/state with refreshed: true)"
          content:
            application/json:
              example:
                success: true
                data:
                  url: "https://example.com/form"
                  title: "Order Form"
                  refreshed: true
                  refGeneration: 5
                  interactiveElements: []


  /api/interactive:
    get:
      operationId: getInteractive
      tags: [Page State]
      summary: Interactive elements only (lighter)
      description: Same element data as /api/state but without page text, headings, or error summaries.
      parameters:
        - name: visible
          in: query
          schema:
            type: boolean
            default: true
          description: Set to false to include hidden elements
      responses:
        "200":
          description: Interactive elements
          content:
            application/json:
              example:
                success: true
                data:
                  count: 8
                  refGeneration: 3
                  elements: []


  /api/screenshot:
    get:
      operationId: getScreenshot
      tags: [Page State]
      summary: Capture screenshot
      description: |
        Capture a screenshot as PNG or JPEG. Returns JSON with the file path (never raw bytes).
        Use `?base64=true` to include inline image data for LLM workflows.
        Use `?ref=N` or `?selector=CSS` to capture a specific element.
      parameters:
        - name: base64
          in: query
          schema:
            type: boolean
            default: false
          description: Include base64-encoded image data inline
        - name: format
          in: query
          schema:
            type: string
            enum: [png, jpeg]
            default: png
          description: Image format
        - name: quality
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 80
          description: JPEG quality (only with format=jpeg)
        - name: ref
          in: query
          schema:
            type: integer
          description: Element ref number - capture only that element
        - name: selector
          in: query
          schema:
            type: string
          description: CSS selector - capture only matched element
        - name: padding
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 0
          description: Extra pixels around element
      responses:
        "200":
          description: Screenshot captured
          content:
            application/json:
              examples:
                fullPage:
                  summary: Full page screenshot
                  value:
                    success: true
                    data:
                      path: "C:\\Users\\...\\trowser-20250217-123456.png"
                      format: png
                llmOptimized:
                  summary: LLM-optimized JPEG with base64
                  value:
                    success: true
                    data:
                      path: "C:\\Users\\...\\trowser-20250217-123456.jpg"
                      format: jpeg
                      base64: "iVBORw0KGgo..."


  /api/screenshot/compare:
    post:
      operationId: compareScreenshots
      tags: [Page State]
      summary: Visual regression - compare two screenshots
      description: |
        Compare two screenshots pixel-by-pixel. Changed pixels are highlighted in red.
        If `after` is omitted, the current page is captured automatically.

        **Workflow:** screenshot â†’ action â†’ compare against the before screenshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before:
                  type: string
                  description: File path or base64 image data
                after:
                  type: string
                  description: File path or base64. Omit to auto-capture current page
                threshold:
                  type: integer
                  minimum: 0
                  maximum: 255
                  default: 30
                  description: Pixel difference sensitivity (lower = more sensitive)
            example:
              before: "C:\\Users\\...\\before.png"
      responses:
        "200":
          description: Diff result
          content:
            application/json:
              example:
                success: true
                data:
                  diffPath: "C:\\Users\\...\\trowser-diff.png"
                  diffBase64: "iVBORw0KGgo..."
                  diffPercent: 12.34
                  changedPixels: 45678
                  totalPixels: 370000
                  width: 1000
                  height: 370
                  match: false


  /api/page-text:
    get:
      operationId: getPageText
      tags: [Page State]
      summary: All visible page text
      description: Returns `document.body.innerText`.
      responses:
        "200":
          description: Page text
          content:
            application/json:
              example:
                success: true
                data:
                  text: "Full visible page text here..."
                  length: 4523


  /api/source:
    get:
      operationId: getSource
      tags: [Page State]
      summary: Full HTML source
      description: Returns `document.documentElement.outerHTML` - includes hidden comments, invisible elements, and complete DOM structure.
      responses:
        "200":
          description: HTML source
          content:
            application/json:
              example:
                success: true
                data:
                  html: "<!DOCTYPE html><html>...</html>"
                  length: 12345

  # â”€â”€ Console & Network â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/console:
    get:
      operationId: getConsole
      tags: [Console & Network]
      summary: Browser console messages
      description: "Gate-free - safe for passive polling. Levels: log, info, warning, error."
      responses:
        "200":
          description: Console entries
          content:
            application/json:
              example:
                success: true
                data:
                  count: 2
                  entries:
                    - id: 1
                      level: error
                      message: "Uncaught TypeError: Cannot read property 'x' of null"
                      timestamp: "2025-02-17T12:34:56.789Z"
                    - id: 2
                      level: warning
                      message: "Deprecation warning: ..."
                      timestamp: "2025-02-17T12:34:57.000Z"


  /api/console/clear:
    post:
      operationId: clearConsole
      tags: [Console & Network]
      summary: Clear console log
      description: Use between test sections to isolate errors to specific actions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Console cleared
          content:
            application/json:
              example:
                success: true
                data:
                  message: "Console log cleared."


  /api/network:
    get:
      operationId: getNetwork
      tags: [Console & Network]
      summary: Network traffic log
      description: |
        Gate-free - safe for passive polling. All filters are combinable.
      parameters:
        - name: errors
          in: query
          schema:
            type: boolean
          description: Only 4xx/5xx responses
        - name: url
          in: query
          schema:
            type: string
          description: Filter by URL substring (case-insensitive)
          example: "api/data"
        - name: method
          in: query
          schema:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          description: Filter by HTTP method
        - name: status
          in: query
          schema:
            type: integer
          description: Filter by exact status code
          example: 404
        - name: type
          in: query
          schema:
            type: string
          description: "Filter by resource type: Document, Script, Stylesheet, Image, XHR, Fetch, etc."
          example: Fetch
        - name: includeBody
          in: query
          schema:
            type: boolean
          description: Include request/response bodies
        - name: includeHeaders
          in: query
          schema:
            type: boolean
          description: Include full HTTP request/response headers
        - name: includeDataUrls
          in: query
          schema:
            type: boolean
          description: Include data: URLs (default false)
        - name: preferInteractive
          in: query
          schema:
            type: boolean
          description: Soft-prefer Document/Fetch/XHR ordering (default true)
        - name: maxUrlChars
          in: query
          schema:
            type: integer
            default: 500
          description: Truncate displayed URL length
        - name: limit
          in: query
          schema:
            type: integer
          description: Return only the most recent N matching entries (alias last)
        - name: last
          in: query
          schema:
            type: integer
          description: Alias for limit — most recent N entries
        - name: summary
          in: query
          schema:
            type: boolean
          description: Compact one-line-per-request for all matches (summary string array instead of entries)
      responses:
        "200":
          description: Network entries
          content:
            application/json:
              example:
                success: true
                data:
                  count: 12
                  errors: 2
                  shown: 12
                  truncated: false
                  entries:
                    - id: 1
                      method: GET
                      url: "https://example.com/"
                      statusCode: 200
                      resourceType: Document
                      isError: false
                      timestamp: "2025-02-17T12:34:56.789Z"


  /api/network/clear:
    post:
      operationId: clearNetwork
      tags: [Console & Network]
