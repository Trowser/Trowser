  /api/interrupter:
    post:
      operationId: interrupter
      tags: [Robustness]
      summary: Fault-injection testing (API interrupter)
      description: |
        Auto-discovers API endpoints from network log, ranks by relevance,
        injects faults via mocks, reloads, and checks for failures.
        Same-origin filtering by default.
        **Requires `safetyMode: active`** - reloads the page multiple times.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                safetyMode:
                  type: string
                  enum: [passive, safe, active, aggressive]
                  default: safe
                  description: Must be active or aggressive. Legacy confirmBackend true is accepted as alias for active.
                url:
                  type: string
                  description: Target specific URL (bypasses auto-discovery)
                method:
                  type: string
                  description: Filter by HTTP method
                faults:
                  type: array
                  items:
                    type: string
                  description: "Fault names: server-error, not-found, empty-body, invalid-json, slow-response, unauthorized, forbidden, rate-limited, mutate-response"
                maxEndpoints:
                  type: integer
                  default: 5
                waitForIdle:
                  type: boolean
                  default: false
                allowedHosts:
                  type: array
                  items:
                    type: string
                  description: Additional hosts beyond current origin
                cooldownMs:
                  type: integer
                  default: 0
                  description: Delay between scenarios
                customFaults:
                  type: array
                  items:
                    type: object
                    required: [name, status]
                    properties:
                      name:
                        type: string
                      status:
                        type: integer
                      body:
                        type: string
                      headers:
                        type: object
                      delayMs:
                        type: integer
                actions:
                  type: array
                  items:
                    type: object
                    required: [action]
                    properties:
                      action:
                        type: string
                      byText:
                        type: string
                      placeholder:
                        type: string
                      selector:
                        type: string
                      text:
                        type: string
                      value:
                        type: string
                  description: Actions to replay after each reload
            examples:
              basic:
                summary: Basic fault injection
                value:
                  safetyMode: active
                  maxEndpoints: 3
              targeted:
                summary: Target specific API
                value:
                  safetyMode: active
                  url: "https://example.com/api/users"
                  faults: ["server-error", "slow-response", "empty-body"]
              withActions:
                summary: With replay actions
                value:
                  safetyMode: active
                  actions:
                    - action: click
                      byText: "Load data"
      responses:
        "200":
          description: Interrupter results

