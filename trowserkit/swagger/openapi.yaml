  # â”€â”€ Navigation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/navigate:
    post:
      operationId: navigate
      tags: [Navigation]
      summary: Navigate to URL or session history step
      description: |
        Open a URL (`url`), or move back/forward in session history (`action`: `back` | `forward`).
        History uses Chrome DevTools Protocol (Page.navigateToHistoryEntry). Prepends `https://` when `url` has no scheme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Target URL (omit when using action)
                  example: "https://example.com"
                action:
                  type: string
                  enum: [back, forward]
                  description: Session history step (omit when using url)
            examples:
              byUrl:
                value:
                  url: "https://example.com"
              back:
                value:
                  action: back
              forward:
                value:
                  action: forward
      responses:
        "200":
          description: Navigation complete
          content:
            application/json:
              examples:
                urlNav:
                  value:
                    success: true
                    data:
                      url: "https://example.com"
                      title: "Example Domain"
                      changes: null
                history:
                  value:
                    success: true
                    data:
                      action: back
                      url: "https://example.com/prev"
                      title: "Previous page"
                      changes: null


  /api/wait-for-navigation:
    post:
      operationId: waitForNavigation
      tags: [Navigation]
      summary: Wait for next navigation event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  default: 10000
                  description: Max wait (ms)
            example:
              timeout: 10000
      responses:
        "200":
          description: Navigation result
          content:
            application/json:
              examples:
                navigated:
                  value:
                    success: true
                    data:
                      navigated: true
                      url: "https://example.com/dashboard"
                      title: Dashboard
                timeout:
                  value:
                    success: true
                    data:
                      navigated: false


  /api/wait-for-final-navigation:
    post:
      operationId: waitForFinalNavigation
      tags: [Navigation]
      summary: Wait through redirect chains (SSO, OAuth)
      description: Waits for `quietPeriod` ms of no new navigations after the last redirect.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quietPeriod:
                  type: integer
                  default: 500
                  description: Quiet period after last navigation (ms)
                timeout:
                  type: integer
                  default: 15000
                  description: Max total wait (ms)
            example:
              quietPeriod: 500
              timeout: 15000
      responses:
        "200":
          description: Final navigation result
          content:
            application/json:
              example:
                success: true
                data:
                  navigations: 3
                  url: "https://app.example.com/dashboard"
                  title: Dashboard
                  quietPeriodMs: 500
                  timeoutMs: 15000


  /api/wait-for-idle:
    post:
      operationId: waitForIdle
      tags: [Navigation]
      summary: Wait for network idle and no animations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quietPeriod:
                  type: integer
                  default: 500
                timeout:
                  type: integer
                  default: 10000
            example:
              quietPeriod: 500
              timeout: 10000
      responses:
        "200":
          description: Idle result
          content:
            application/json:
              example:
                success: true
                data:
                  idle: true
                  quietPeriodMs: 500
                  timeoutMs: 10000

  # â”€â”€ Element Interaction â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/click:
    post:
      operationId: click
      tags: [Element Interaction]
      summary: Click an element
      description: |
        Auto-waits for visible + enabled. Auto-waits for navigation on `<a href>` links.
        Returns `changes` summary if URL, title, or errors changed.
        Supports right-click (`button: "right"`) and double-click (`clickCount: 2`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: integer
                  description: Element ref number
                selector:
                  type: string
                role:
                  type: string
                name:
                  type: string
                label:
                  type: string
                byText:
                  type: string
                placeholder:
                  type: string
                testId:
                  type: string
                button:
                  type: string
                  enum: [left, right, middle]
                  default: left
                clickCount:
                  type: integer
                  default: 1
                  description: "1 = single click, 2 = double-click"
                timeout:
                  type: integer
                  default: 5000
                refGeneration:
                  type: integer
                  description: Pass for hard stale-ref error instead of warning
            examples:
              byRef:
                summary: Click by ref number
                value:
                  ref: 2
              byRole:
                summary: Click by ARIA role
                value:
                  role: button
                  name: Submit
              rightClick:
                summary: Right-click
                value:
                  ref: 5
                  button: right
              doubleClick:
                summary: Double-click
                value:
                  ref: 5
                  clickCount: 2
      responses:
        "200":
          description: Element clicked
          content:
            application/json:
              example:
                success: true
                data:
                  clicked: "#submit-btn"
                  button: left
                  clickCount: 1
                  changes:
                    urlChanged:
                      from: "https://example.com/"
                      to: "https://example.com/dashboard"
                    titleChanged:
                      from: Home
                      to: Dashboard


  /api/type:
    post:
      operationId: typeText
      tags: [Element Interaction]
      summary: Clear input and type text
      description: |
        Clears the input first, then types the text. Auto-waits for visible + enabled.
        Detects contenteditable elements and uses `execCommand` for compatibility.
        Pass `html` for formatted content in rich text editors.
        Use `append: true` or `clearFirst: false` to append to existing content instead of clearing.
        Content: provide `text`, or `value` as a content alias when the element is already addressed
        by ref/selector/another locator (MCP-shaped). Without another locator, `value` remains the
        `@value:` element locator. Returns 400 if none of text/value(content)/html is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: integer
                selector:
                  type: string
                label:
                  type: string
                placeholder:
                  type: string
                role:
                  type: string
                name:
                  type: string
                byText:
                  type: string
                testId:
                  type: string
                value:
                  type: string
                  description: >
                    Typed content when ref/selector/another locator is present (alias of text).
                    Alone, targets radio/checkbox/option by value attribute (@value: locator).
                text:
                  type: string
                  description: Text to type (empty string clears the field)
                html:
                  type: string
                  description: HTML content for contenteditable elements
                append:
                  type: boolean
                  default: false
                  description: If true, append text to existing content instead of clearing first
                clearFirst:
                  type: boolean
                  default: true
                  description: If false, append text to existing content instead of clearing first
                timeout:
                  type: integer
                  default: 5000
            examples:
              byRef:
                summary: Type into input by ref
                value:
                  ref: 0
                  text: "user@example.com"
              byRefValueAlias:
                summary: Type using value as content alias (MCP-shaped)
                value:
                  ref: 0
                  value: "user@example.com"
              byLabel:
                summary: Type by label
                value:
                  label: Email
                  text: "user@example.com"
              byPlaceholder:
                summary: Type by placeholder
                value:
                  placeholder: "Search..."
                  text: "test query"
      responses:
        "200":
          description: Text typed
          content:
            application/json:
              example:
                success: true
                data:
                  typed: "user@example.com"
                  into: "#email"


  /api/find:
    post:
      operationId: findText
      tags: [Element Interaction]
      summary: Search visible page text
      description: |
        Find text on the page with context, CSS selector, and bounding rect.
        Useful for finding non-interactive content (status messages, paragraphs).
        Supports regex, scroll-to-match, and highlight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Text to search for
                caseSensitive:
                  type: boolean
                  default: false
                regex:
                  type: boolean
                  default: false
                  description: Treat text as regex pattern
                scrollTo:
                  type: integer
                  description: Scroll to Nth match (0-based)
                highlight:
                  type: boolean
                  default: false
                  description: Highlight matches with yellow background
                visibleOnly:
                  type: boolean
                  default: true
                  description: Only search visible text
            example:
              text: "Order confirmed"
              highlight: true
      responses:
        "200":
          description: Search results
          content:
            application/json:
              example:
                success: true
                data:
                  matchCount: 1
                  matches:
                    - index: 0
                      text: "Order confirmed"
                      matchText: "Order confirmed"
                      context: "Your Order confirmed successfully."
                      selector: "#order-status > p"
                      tag: p
                      rect: { x: 120, y: 450, width: 130, height: 18 }


  /api/find/clear:
    post:
      operationId: clearFindHighlights
      tags: [Element Interaction]
      summary: Remove find highlights
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Highlights cleared
          content:
            application/json:
              example:
                success: true
                data:
                  message: "Find highlights cleared."


  /api/select:
    post:
      operationId: selectOption
      tags: [Element Interaction]
      summary: Select dropdown option
      description: Select by value. Returns `actual` with post-selection DOM state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: integer
                selector:
                  type: string
                role:
                  type: string
                name:
                  type: string
                label:
                  type: string
                value:
                  type: string
                  default: ""
                  description: Option value to select
                timeout:
                  type: integer
            example:
              ref: 7
              value: "us"
      responses:
        "200":
          description: Option selected
          content:
            application/json:
              example:
                success: true
                data:
                  selected: "us"
                  in: "#country"
                  actual:
                    value: "us"
                    selectedIndex: 3
                    selectedText: "United States"
                    tagName: select


  /api/hover:
    post:
      operationId: hover
      tags: [Element Interaction]
      summary: Hover over element
      description: Real CDP mouse movement - triggers CSS :hover, tooltips, dropdown menus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElementTarget"
            example:
              ref: 12
      responses:
        "200":
          description: Element hovered
          content:
            application/json:
              example:
                success: true
                data:
                  hovered: "#settings-icon"


  /api/scroll:
    post:
      operationId: scroll
      tags: [Element Interaction]
      summary: Scroll page or element
      description: |
        Auto-detects scrollable container when no element is given.
        Use `scrollIntoView: true` for off-screen elements.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: integer
                selector:
                  type: string
                direction:
                  type: string
                  enum: [up, down, top, bottom]
                  default: down
                scrollIntoView:
                  type: boolean
                  default: false
                  description: Scroll element into viewport center
            examples:
              scrollDown:
                summary: Scroll page down
                value:
                  direction: down
              scrollIntoView:
                summary: Scroll element into view
                value:
                  ref: 25
                  scrollIntoView: true
              scrollToTop:
                summary: Scroll to top
                value:
                  direction: top
      responses:
        "200":
          description: Scrolled
          content:
            application/json:
              example:
                success: true
                data:
                  scrolled: window
                  direction: down
                  scrollIntoView: false


  /api/key:
    post:
      operationId: pressKey
      tags: [Element Interaction]
      summary: Send keyboard key press
      description: "Supports modifiers. Keys: Tab, Enter, Escape, Space, Backspace, Delete, arrows, F1-F12, or any character."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: Key name
                  example: Enter
                ref:
                  type: integer
                selector:
                  type: string
                modifiers:
                  type: array
                  items:
                    type: string
                    enum: [Shift, Control, Alt, Meta]
                  description: Modifier keys
            examples:
              enter:
                summary: Press Enter
                value:
                  key: Enter
              ctrlA:
                summary: Ctrl+A (select all)
                value:
                  key: a
                  modifiers: [Control]
              tabToNext:
                summary: Tab to next field
                value:
                  key: Tab
      responses:
        "200":
          description: Key pressed
          content:
            application/json:
              example:
                success: true
                data:
                  key: Enter

  # â”€â”€ Element Data â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€


  /api/text:
    post:
      operationId: getText
      tags: [Element Data]
      summary: Element inner text (pierces shadow DOM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElementTarget"
            example:
              ref: 0
      responses:
        "200":
          description: Element text
          content:
            application/json:
              example:
                success: true
                data:
                  text: "Welcome to Example"
                  selector: "#main-heading"


  /api/attribute:
    post:
      operationId: getAttribute
      tags: [Element Data]
      summary: HTML attribute value (pierces shadow DOM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attribute]
              properties:
                ref:
                  type: integer
                selector:
                  type: string
                role:
                  type: string
                name:
                  type: string
                attribute:
                  type: string
                  description: Attribute name to read
                  example: placeholder
                timeout:
                  type: integer
