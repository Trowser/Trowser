  /api/property:
    post:
      operationId: getProperty
      tags: [Element Data]
      summary: Live DOM property (framework-managed)
      description: |
        Reads the current property state as managed by JavaScript frameworks.
        Use for `value`, `checked`, `selectedIndex`, `disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property]
              properties:
                ref:
                  type: integer
                selector:
                  type: string
                role:
                  type: string
                name:
